name: Build & Static Analysis

# NOTE ON SCOPE:
# GitHub-hosted runners have no Android device/emulator, so the Appium suite
# CANNOT execute here. This workflow therefore does BUILD + STATIC ANALYSIS only
# and does not pretend to run the device tests. Run the actual TestNG suite on a
# self-hosted runner attached to the device host (see the commented job below).

on:
  push:
    branches: [ master, rb/BoF ]
  pull_request:
    branches: [ master, rb/BoF ]
  schedule:
    - cron: '0 2 * * *'  # Nightly at 02:00 UTC

jobs:
  build:
    name: Compile (Java ${{ matrix.java-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [ '17', '21' ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'
          cache: maven

      # Compiles BOTH main and test sources. This is the real signal from CI:
      # the project builds. It does not (and cannot) run the device tests here.
      - name: Compile (main + test)
        run: mvn -B clean test-compile

  code-quality:
    name: Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Advisory only — failOnViolation/failOnError are false in the pom.
      - name: Checkstyle
        run: mvn -B checkstyle:check
        continue-on-error: true

      - name: SpotBugs
        run: mvn -B compile spotbugs:check
        continue-on-error: true

